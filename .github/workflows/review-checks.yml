name: TPC review deployment checks
on:
  push:
    branches: [public-review]
  pull_request:
permissions:
  contents: read
jobs:
  wsgi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify auth, media, member isolation and persistent SQLite through WSGI
        run: python -m unittest deployment.test_wsgi deployment.test_static_preview -v
      - name: Verify static preview request boundary
        run: node --test deployment/test_static_preview.mjs
      - name: Build Pages-compatible public files without private runtime data
        run: python deployment/build_static_preview.py --output _site --base /TPC-public-review/
